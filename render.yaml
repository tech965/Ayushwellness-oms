services:
  # The API (uvicorn/FastAPI) and web (Next.js) services that used to
  # live here moved to Vercel — apps/api/vercel.json and Vercel's own
  # zero-config Next.js build handle those now (separate Vercel
  # projects, Root Directory set to apps/api and apps/web respectively).
  # Only the Celery worker stays here: it's a long-lived process
  # (`-B` embeds Celery beat, polling Redis continuously) and has no
  # equivalent on Vercel's on-demand serverless model.
  #
  # Moving the API off Render drops two things that lived on it and
  # need a new home:
  #   - `alembic upgrade head` (previously this service's
  #     preDeployCommand, see git history) — Vercel has no equivalent
  #     hook; run migrations manually or from CI before/with each
  #     deploy.
  #   - CORS_ORIGINS / NEXT_PUBLIC_API_URL previously pointed at
  #     *.onrender.com — repoint them at the new Vercel domains once
  #     those projects exist.
  - type: worker
    name: ayushwellness-oms-worker
    runtime: python
    rootDir: apps/api
    # Processes SyncJob/WebhookEvent tasks queued by the web service
    # (app.tasks.sync_tasks, webhook_processing, shiprocket_sync,
    # reconciliation_tasks, retry_processing — see
    # app/workers/celery_app.py). Without this service running, sync
    # jobs triggered via POST /api/v1/sync/{id}/trigger stay QUEUED
    # forever — the web service only enqueues them, it never executes
    # them itself.
    #
    # `-B` embeds Celery beat in this same process, so
    # `sync.run_scheduled` (celery_app.py's `beat_schedule`) actually
    # fires every 10 minutes in production — this is the automatic-sync
    # backstop found missing during a live Shopify-vs-OMS reconciliation
    # (no webhooks were registered and no schedule existed, so orders
    # only ever reached the OMS via a manual "Trigger Sync" click).
    # `-B` is only safe with exactly one worker INSTANCE (Celery docs:
    # running it on more than one double/triple-schedules the same job) —
    # multiple prefork child processes via --concurrency on ONE instance
    # is fine. If this service is ever scaled to >1 instance, move beat to
    # its own single-instance service instead and drop `-B` here.
    #
    # `-Q celery,shiprocket` + `--concurrency=3`: Shopify order/customer/
    # product syncs run on the `celery` queue, Shiprocket's long
    # `shipments`/`ndr` list crawls on the `shiprocket` queue (see
    # `queue_for_entity`/`route_task` in app/workers/celery_app.py). With
    # >=2 child processes draining both queues in parallel, a slow or
    # stuck Shiprocket crawl can no longer occupy the only worker slot and
    # stall Shopify order syncs — the production incident this fixes. The
    # per-task hard time limit (task_time_limit=660 in celery_app.py)
    # reclaims a genuinely hung child; the stale-job reaper then fails its
    # SyncJob row.
    #
    # NOTE: a Start Command set in the Render dashboard OVERRIDES this
    # file and will not pick up this change on its own — update the
    # dashboard value to exactly:
    #   celery -A app.workers.celery_app worker -B -Q celery,shiprocket --concurrency=3 --loglevel=info
    buildCommand: pip install --upgrade pip && pip install -r requirements-lock.txt
    startCommand: celery -A app.workers.celery_app worker -B -Q celery,shiprocket --concurrency=3 --loglevel=info
    envVars:
      # Overlaps with what the API needs (now set separately in its
      # Vercel project) — set independently here too, since env vars
      # aren't shared across services/platforms.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        sync: false
